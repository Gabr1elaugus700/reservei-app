name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: gabgarb/reservei-app
  NEXT_PUBLIC_BASE_DOMAIN: "${{ vars.NEXT_PUBLIC_BASE_DOMAIN || 'app-reservei.com.br' }}"
  NEXT_PUBLIC_ADMIN_SUBDOMAIN: "${{ vars.NEXT_PUBLIC_ADMIN_SUBDOMAIN || 'app' }}"
  NEXT_PUBLIC_PUBLIC_SUBDOMAIN: "${{ vars.NEXT_PUBLIC_PUBLIC_SUBDOMAIN || 'reservas' }}"
  NEXT_PUBLIC_APP_URL: "${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.app-reservei.com.br' }}"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{raw}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BASE_DOMAIN=${{ env.NEXT_PUBLIC_BASE_DOMAIN }}
            NEXT_PUBLIC_ADMIN_SUBDOMAIN=${{ env.NEXT_PUBLIC_ADMIN_SUBDOMAIN }}
            NEXT_PUBLIC_PUBLIC_SUBDOMAIN=${{ env.NEXT_PUBLIC_PUBLIC_SUBDOMAIN }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
